<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dancing Bricks</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;background:#05060a;color:#F5E6C8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:radial-gradient(ellipse at 50% -10%,#1a1408 0%,#0b0a10 45%,#05060a 100%);}
  #app{max-width:440px;margin:0 auto;padding:10px 12px 16px;display:flex;flex-direction:column;}
  
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;
    border:1.5px solid rgba(212,165,90,.55);background:rgba(212,165,90,.07);
    font-size:12px;color:#E8CFA0;box-shadow:0 0 12px rgba(212,165,90,.13);cursor:pointer;}
  .chip img{width:20px;height:20px;border-radius:50%;}
  .chip .av{width:20px;height:20px;border-radius:50%;background:rgba(212,165,90,.2);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:#D4A55A;}
  
  .title{text-align:center;margin:2px 0 10px;}
  .title .t1{font-size:20px;font-weight:800;letter-spacing:3px;color:#F0D9A8;
    text-shadow:0 0 8px rgba(240,200,120,.65),0 0 22px rgba(212,165,90,.4);}
  .title .t2{font-size:9px;letter-spacing:4px;color:rgba(212,165,90,.75);margin-top:2px;}
  
  .hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:12px;}
  .hearts{display:flex;gap:4px;}
  .hearts svg{width:17px;height:17px;filter:drop-shadow(0 0 5px rgba(224,90,60,.7));}
  .hud .box{padding:4px 10px;border-radius:8px;border:1.5px solid rgba(212,165,90,.4);
    background:rgba(212,165,90,.06);color:#C9B285;letter-spacing:.5px;}
  .hud .box b{color:#F5E6C8;font-weight:700;}
  .hud .gold b{color:#F0C674;}
  .hud .danger b{color:#ff4444;}
  
  .banner{display:none;align-items:center;justify-content:center;font-size:11px;font-weight:700;
    letter-spacing:1px;color:#1a1200;background:linear-gradient(90deg,#D4A55A,#F0D9A8,#D4A55A);
    border-radius:8px;padding:6px;margin-bottom:7px;box-shadow:0 0 18px rgba(240,200,120,.55);}
  
  .stage{position:relative;width:100%;aspect-ratio:5/7;border-radius:14px;
    border:2px solid rgba(212,165,90,.5);background:rgba(6,8,14,.85);overflow:hidden;
    box-shadow:0 0 22px rgba(212,165,90,.18),inset 0 0 40px rgba(0,0,0,.6);}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;text-align:center;padding:16px 20px;background:rgba(5,6,10,.95);z-index:10;}
  .overlay .big{font-size:18px;font-weight:800;letter-spacing:2px;color:#F0D9A8;
    text-shadow:0 0 10px rgba(240,200,120,.6);}
  .overlay .msg{font-size:12px;color:#C9B285;line-height:1.5;}
  .overlay .hint{font-size:11px;color:rgba(201,178,133,.6);}
  
  .statrow{display:flex;gap:16px;margin:2px 0;}
  .statrow div{font-size:10px;color:#8a7d63;}
  .statrow div b{display:block;font-size:17px;color:#F0C674;font-weight:800;margin-top:2px;}
  
  button{font-family:inherit;cursor:pointer;border-radius:10px;border:2px solid rgba(212,165,90,.7);
    background:transparent;color:#F0D9A8;padding:10px 22px;font-size:12px;font-weight:700;
    letter-spacing:1px;box-shadow:0 0 14px rgba(212,165,90,.25);transition:transform 0.15s;}
  button:active{transform:scale(.96);}
  button.pri{background:linear-gradient(180deg,#E0B96A,#C89B3C);color:#191100;border-color:#F0D9A8;
    box-shadow:0 0 22px rgba(240,200,120,.5);}
  button.sec{background:rgba(212,165,90,.12);color:#F0D9A8;border-color:rgba(212,165,90,.4);}
  button.ghost{border-color:rgba(212,165,90,.3);color:rgba(201,178,133,.7);
    padding:6px 12px;font-size:10px;box-shadow:none;font-weight:400;letter-spacing:0;}
  
  .btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
  
  .lb-panel{width:100%;max-height:85%;overflow-y:auto;background:rgba(12,14,22,.96);
    border:1px solid rgba(212,165,90,.4);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .lb-title{font-size:14px;font-weight:800;color:#F0D9A8;letter-spacing:1px;margin-bottom:4px;}
  .lb-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
    border-radius:8px;background:rgba(212,165,90,.05);border:1px solid rgba(212,165,90,.15);font-size:12px;}
  .lb-item.is-me{border-color:#D4A55A;background:rgba(212,165,90,.18);}
  .lb-left{display:flex;align-items:center;gap:8px;}
  .lb-rank{font-weight:800;width:20px;text-align:center;}
  .lb-name{font-weight:700;color:#F5E6C8;}
  .lb-score{font-weight:800;color:#F0C674;}

  .foot{margin-top:8px;text-align:center;font-size:10px;color:rgba(201,178,133,.45);letter-spacing:.5px;}
  .devrow{margin-top:8px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="chip" id="userchip"><div class="av">?</div><span id="uname">სტუმარი</span></div>
    <div class="chip" id="lbBtn" style="border-color:rgba(240,198,116,.6);background:rgba(240,198,116,.12);">
      🏆 <span>ლიდერბორდი</span>
    </div>
    <div class="chip" style="border-color:rgba(224,90,60,.5);background:rgba(224,90,60,.07);">
      <div class="hearts" id="hearts"></div>
    </div>
  </div>

  <div class="title">
    <div class="t1">DANCING BRICKS</div>
    <div class="t2">ST DANCE STUDIO</div>
  </div>

  <div class="hud">
    <div class="box">რაუნდი <b id="round">1</b></div>
    <div class="box">ბურთი <b id="ballct">1</b></div>
    <div class="box danger" id="spdBox">სიჩქარე <b id="spdVal">1.0x</b></div>
    <div class="box gold">ქულა <b id="score">0</b></div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="foot" id="foot">რაუნდი +10 · მე-5 რაუნდი +25 · აგური +2 · სიჩქარე იზრდება!</div>
  <div class="devrow"><button class="ghost" id="resetBtn">პროგრესის განულება (ტესტი)</button></div>
</div>

<script>
(function(){
  var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
  var user=null;
  if(tg){ tg.ready(); tg.expand();
    try{ tg.setHeaderColor('#05060a'); tg.setBackgroundColor('#05060a'); }catch(e){}
    if(tg.initDataUnsafe&&tg.initDataUnsafe.user) user=tg.initDataUnsafe.user; }

  var DAY=86400000;
  var st={lives:3,livesTs:Date.now(),total:0,best:0,highScore:0,playerName:'',bonusSeen:''};
  var cloudOK=!!(tg&&tg.CloudStorage&&tg.CloudStorage.getItem);

  var DEFAULT_LEADERBOARD = [
    { name: 'სერგო წივწივაძე (Head Coach)', score: 1450, round: 18 },
    { name: 'მარიამი (Samba Queen)', score: 1120, round: 14 },
    { name: 'ნიკოლოზი (Cha-Cha King)', score: 980, round: 12 },
    { name: 'ანა (Rumba Master)', score: 760, round: 10 },
    { name: 'გიორგი (Jive Champ)', score: 620, round: 8 }
  ];

  function getLeaderboard(){
    try {
      var saved = localStorage.getItem('db_leaderboard');
      if(saved) return JSON.parse(saved);
    } catch(e){}
    return DEFAULT_LEADERBOARD;
  }

  function saveLeaderboardRecord(name, score, rnd){
    if(!name || score <= 0) return;
    var lb = getLeaderboard();
    var existingIdx = lb.findIndex(function(item){ return item.name === name; });
    if(existingIdx >= 0){
      if(score > lb[existingIdx].score){
        lb[existingIdx].score = score;
        lb[existingIdx].round = Math.max(lb[existingIdx].round || 0, rnd);
      }
    } else {
      lb.push({ name: name, score: score, round: rnd });
    }
    lb.sort(function(a,b){ return b.score - a.score; });
    lb = lb.slice(0, 10);
    try{ localStorage.setItem('db_leaderboard', JSON.stringify(lb)); }catch(e){}
  }

  function loadState(cb){
    if(!cloudOK){
      try{ var raw=localStorage.getItem('db_state'); if(raw) st=Object.assign(st,JSON.parse(raw)); }catch(e){}
      return cb();
    }
    try{
      tg.CloudStorage.getItem('state',function(err,val){
        if(!err&&val){ try{ st=Object.assign(st,JSON.parse(val)); }catch(e){} }
        cb();
      });
    }catch(e){ cb(); }
  }
  function saveState(){
    var s=JSON.stringify(st);
    if(cloudOK){ try{ tg.CloudStorage.setItem('state',s,function(){}); }catch(e){} }
    try{ localStorage.setItem('db_state',s); }catch(e){}
  }
  function refreshLives(){
    if(Date.now()-st.livesTs>=DAY){ st.lives=3; st.livesTs=Date.now(); saveState(); }
  }
  function grantBonus(){
    try{
      var p=new URLSearchParams(location.search);
      if(p.get('bonus')==='life'){
        var stamp=String(Math.floor(Date.now()/3600000));
        if(st.bonusSeen!==stamp){
          st.lives=Math.min(st.lives+1,5); st.bonusSeen=stamp; saveState();
          showBanner('+1 სიცოცხლე დაგერიცხა',2600);
        }
      }
    }catch(e){}
  }

  var chip=document.getElementById('userchip'),uname=document.getElementById('uname');
  var lbBtn=document.getElementById('lbBtn');

  if(user){
    st.playerName = user.first_name + (user.last_name ? ' ' + user.last_name : '');
    uname.textContent = st.playerName;
    if(user.photo_url){ var im=document.createElement('img'); im.src=user.photo_url; chip.replaceChild(im,chip.firstElementChild); }
  } else {
    st.playerName = st.playerName || 'მოცეკვავე';
    uname.textContent = st.playerName;
  }

  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var ov=document.getElementById('ov');
  var roundEl=document.getElementById('round'),ballctEl=document.getElementById('ballct'),
      spdValEl=document.getElementById('spdVal'),
      scoreEl=document.getElementById('score'),heartsEl=document.getElementById('hearts'),
      banner=document.getElementById('banner'),foot=document.getElementById('foot'),
      resetBtn=document.getElementById('resetBtn');

  var GOLD_L='#F0D9A8';
  var TIERS=[
    {f:'rgba(212,165,90,.16)',s:'#D4A55A',t:'#F0D9A8'},
    {f:'rgba(120,190,220,.16)',s:'#6FC3E0',t:'#BEE7F5'},
    {f:'rgba(190,120,220,.16)',s:'#B87BDE',t:'#E3C6F5'},
    {f:'rgba(230,120,90,.16)',s:'#E0764A',t:'#F5C7B0'},
    {f:'rgba(120,220,150,.16)',s:'#6FD98F',t:'#C3F0D2'},
    {f:'rgba(255,68,68,.25)',s:'#FF4444',t:'#FFB3B3'}
  ];

  var W=0,H=0,DPR=1;
  var cols=7,cell=0,pad=8,brickH=0,topY=10,deathY=0,launchY=0;
  var state='menu';
  var bricks=[],balls=[],pickups=[],particles=[];
  var round=1,score=0,lives=3,ballCount=1,ballsPending=0;
  var aiming=false,aimAngle=0,launchX=0,nextLaunchX=null;
  var superShots=0,shootTimer=0,bannerTimer=null,started=false;
  var currentSpeedMult=1.0;

  function showBanner(t,ms){
    banner.textContent=t; banner.style.display='flex';
    if(bannerTimer) clearTimeout(bannerTimer);
    bannerTimer=setTimeout(function(){ banner.style.display='none'; },ms||1800);
  }

  function fit(){
    var r=cv.getBoundingClientRect();
    if(!r.width||!r.height) return;
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cell=(W-pad*2)/cols; brickH=cell*0.78;
    deathY=H-52; launchY=H-28;
    if(state==='menu') launchX=W/2;
    layout(); draw();
  }
  function layout(){
    bricks.forEach(function(b){ b.x=pad+b.col*cell; b.y=topY+b.row*(brickH+6); b.w=cell-5; b.h=brickH; });
    pickups.forEach(function(p){ p.x=pad+p.col*cell+cell/2; p.y=topY+p.row*(brickH+6)+brickH/2; });
  }

  function heart(f){ return '<svg viewBox="0 0 24 24" fill="'+(f?'#E0563C':'none')+'" stroke="#E0563C" stroke-width="2.2"><path d="M12 21s-7-4.3-9.5-8.8C.6 8.4 2.4 5 5.8 5c1.9 0 3.4 1 4.2 2.5C10.8 6 12.3 5 14.2 5c3.4 0 5.2 3.4 3.3 7.2C19 16.7 12 21 12 21z"/></svg>'; }
  function renderHearts(n){
    var v=(typeof n==='number')?n:st.lives;
    var cap=Math.max(3,v),h='';
    for(var i=0;i<cap;i++) h+=heart(i<v);
    heartsEl.innerHTML=h;
  }

  function el(tag,cls,txt){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(txt!==undefined) e.textContent=txt;
    return e;
  }
  function clearOv(){ while(ov.firstChild) ov.removeChild(ov.firstChild); }

  function showMenu(){
    state='menu'; started=false;
    clearOv(); ov.style.display='flex';
    ov.appendChild(el('div','big','DANCING BRICKS'));
    var m=el('div','msg');
    m.innerHTML='გადაასრიალე თითი მიმართულების ასარჩევად. რაუნდებთან ერთად <b style="color:#FF6B6B">სიჩქარე და აგურების გამძლეობა იზრდება!</b><br>ოქროსფერი <b style="color:#F0D9A8">ST</b> ბლოკები სუპერ ძალას იძლევა.';
    ov.appendChild(m);
    
    if(st.lives<=0){
      var warn=el('div','hint','სიცოცხლე ამოეწურა. დაახურე ბოტს და გაიარე 5-კითხვიანი კვიზი.');
      ov.appendChild(warn);
      var b2=el('button','pri','ბოტის გახსნა');
      b2.onclick=function(){ if(tg) tg.close(); else showBanner('გახსენი Telegram ბოტი',2000); };
      ov.appendChild(b2);
    } else {
      var btnRow = el('div','btn-row');
      var b=el('button','pri','დაწყება');
      b.onclick=startGame;
      btnRow.appendChild(b);

      var bLb=el('button','sec','🏆 ლიდერბორდი');
      bLb.onclick=showLeaderboardScreen;
      btnRow.appendChild(bLb);

      ov.appendChild(btnRow);
    }
  }

  function showLeaderboardScreen(){
    clearOv(); ov.style.display='flex';
    var title = el('div','big','🏆 ლიდერბორდი');
    ov.appendChild(title);

    var lbBox = el('div','lb-panel');
    var lb = getLeaderboard();
    lb.forEach(function(item, idx){
      var row = el('div', 'lb-item ' + (item.name === st.playerName ? 'is-me' : ''));
      var rankSym = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx + 1);
      row.innerHTML = '<div class="lb-left"><span class="lb-rank">' + rankSym + '</span><span class="lb-name">' + item.name + '</span></div><span class="lb-score">' + item.score.toLocaleString() + ' ქულა</span>';
      lbBox.appendChild(row);
    });
    ov.appendChild(lbBox);

    var backBtn = el('button','pri','უკან მენიუში');
    backBtn.onclick = showMenu;
    ov.appendChild(backBtn);
  }

  function addRow(){
    bricks.forEach(function(b){ b.row++; });
    pickups.forEach(function(p){ p.row++; });
    
    var hp = Math.min(8, 1 + Math.floor(round / 2) + (round > 6 ? 1 : 0));
    var logoRow = (round % 4 === 1 && round > 1);
    var used = [], n = Math.min(6, 3 + Math.floor(Math.random() * 3) + (round > 5 ? 1 : 0));
    
    for(var k = 0; k < n; k++){
      var c = Math.floor(Math.random() * cols);
      if(used.indexOf(c) !== -1) continue;
      used.push(c);
      var brickHp = (Math.random() < 0.3 && round > 3) ? hp + 1 : hp;
      bricks.push({col:c, row:0, hp:brickHp, logo:false, x:0, y:0, w:0, h:0});
    }
    
    if(logoRow){
      var lc = [];
      for(var c2 = 0; c2 < cols; c2++) if(used.indexOf(c2) === -1) lc.push(c2);
      for(var j = 0; j < 2 && lc.length; j++){
        var pk = lc.splice(Math.floor(Math.random() * lc.length), 1)[0];
        bricks.push({col:pk, row:0, hp:Math.max(2, hp), logo:true, x:0, y:0, w:0, h:0});
        used.push(pk);
      }
    }
    var free = [];
    for(var c3 = 0; c3 < cols; c3++) if(used.indexOf(c3) === -1) free.push(c3);
    if(free.length && Math.random() < 0.75){
      var pc = free[Math.floor(Math.random() * free.length)];
      pickups.push({col:pc, row:0, x:0, y:0, r:7, taken:false});
    }
    layout();
  }

  function startGame(){
    refreshLives();
    if(st.lives <= 0){ showMenu(); return; }
    bricks = []; pickups = []; balls = []; particles = [];
    round = 1; score = 0; ballCount = 1; lives = st.lives;
    superShots = 0; nextLaunchX = null; launchX = W / 2; aimAngle = 0;
    currentSpeedMult = 1.0;

    roundEl.textContent = '1';
    scoreEl.textContent = '0';
    ballctEl.textContent = '1';
    spdValEl.textContent = '1.0x';
    banner.style.display = 'none';

    renderHearts(lives);
    addRow(); addRow(); addRow();
    state = 'aim'; started = true;
    clearOv(); ov.style.display = 'none';
  }

  function launch(){
    if(state !== 'aim') return;
    state = 'shoot'; ballsPending = ballCount; shootTimer = 0; balls = []; nextLaunchX = null;
  }

  function spawnBall(){
    currentSpeedMult = Math.min(2.2, 1.0 + (round - 1) * 0.05);
    spdValEl.textContent = currentSpeedMult.toFixed(1) + 'x';

    var baseSp = superShots > 0 ? 12 : 10;
    var sp = baseSp * currentSpeedMult;
    balls.push({
      x: launchX, y: launchY,
      vx: Math.sin(aimAngle) * sp,
      vy: -Math.cos(aimAngle) * sp,
      r: superShots > 0 ? 9 : 6,
      alive: true,
      sup: superShots > 0
    });
    ballsPending--;
  }

  function hitTest(b, r){
    var cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
    var cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
    var dx = b.x - cx, dy = b.y - cy;
    return dx * dx + dy * dy < b.r * b.r;
  }

  function createExplosion(x, y, color){
    for(var i = 0; i < 8; i++){
      var angle = Math.random() * Math.PI * 2;
      var spd = 1 + Math.random() * 3;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        alpha: 1,
        color: color
      });
    }
  }

  function step(){
    shootTimer++;
    var shootInterval = Math.max(3, 6 - Math.floor(round / 4));
    if(ballsPending > 0 && shootTimer % shootInterval === 0) spawnBall();

    for(var i = 0; i < balls.length; i++){
      var b = balls[i]; if(!b.alive) continue;
      for(var s = 0; s < 2; s++){
        b.x += b.vx / 2; b.y += b.vy / 2;
        if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx); }
        if(b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
        if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy); }

        for(var k = 0; k < bricks.length; k++){
          var br = bricks[k]; if(br.hp <= 0) continue;
          if(hitTest(b, br)){
            br.hp--;
            if(br.hp <= 0){
              score += 2;
              createExplosion(br.x + br.w/2, br.y + br.h/2, br.logo ? GOLD_L : '#E0764A');
              if(br.logo) checkLogo();
            }
            if(!b.sup){
              var ox = Math.min(Math.abs(b.x - br.x), Math.abs(b.x - (br.x + br.w)));
              var oy = Math.min(Math.abs(b.y - br.y), Math.abs(b.y - (br.y + br.h)));
              if(oy < ox) b.vy = -b.vy; else b.vx = -b.vx;
            }
            break;
          }
        }
        for(var p = 0; p < pickups.length; p++){
          var pu = pickups[p]; if(pu.taken) continue;
          var ddx = b.x - pu.x, ddy = b.y - pu.y;
          if(ddx * ddx + ddy * ddy < (b.r + pu.r) * (b.r + pu.r)){
            pu.taken = true; ballCount++; ballctEl.textContent = String(ballCount);
          }
        }
        if(b.y > launchY){
          b.alive = false;
          if(nextLaunchX === null) nextLaunchX = Math.max(12, Math.min(W - 12, b.x));
          break;
        }
      }
    }

    for(var pt = 0; pt < particles.length; pt++){
      var p = particles[pt];
      p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
    }
    particles = particles.filter(function(p){ return p.alpha > 0; });

    balls = balls.filter(function(b){ return b.alive; });
    if(ballsPending <= 0 && balls.length === 0) endRound();
    scoreEl.textContent = String(score);
  }

  function checkLogo(){
    var left = bricks.some(function(x){ return x.logo && x.hp > 0; });
    if(!left){
      if(Math.random() < 0.5){ superShots = 2; showBanner('სუპერ ბურთი აქტიურია'); }
      else { ballCount += 3; ballctEl.textContent = String(ballCount); showBanner('+3 ბურთი'); }
    }
  }

  function endRound(){
    bricks = bricks.filter(function(b){ return b.hp > 0; });
    pickups = pickups.filter(function(p){ return !p.taken; });
    if(superShots > 0) superShots--;
    if(nextLaunchX !== null) launchX = nextLaunchX;

    round++; roundEl.textContent = String(round);
    score += 10; if(round % 5 === 0) score += 25;
    scoreEl.textContent = String(score);

    addRow();

    var over = bricks.some(function(b){ return b.y + b.h >= deathY; });
    if(over){
      lives--; st.lives = lives; st.livesTs = Date.now(); saveState();
      renderHearts(lives); superShots = 0; banner.style.display = 'none';
      if(lives <= 0){ gameOver(); return; }
      showBanner('სიცოცხლე დააკლდი — დარჩა ' + lives, 1600);
      bricks.forEach(function(b){ b.row = Math.max(0, b.row - 3); });
      pickups.forEach(function(p){ p.row = Math.max(0, p.row - 3); });
      layout();
    }
    state = 'aim';
  }

  function draw(){
    if(!W || !H) return;
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = 'rgba(212,165,90,.05)'; ctx.lineWidth = 1;
    for(var gx = 0; gx < W; gx += cell){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
    ctx.restore();

    ctx.save();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(224,86,60,.7)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(0, deathY); ctx.lineTo(W, deathY); ctx.stroke();
    ctx.restore();

    bricks.forEach(function(b){
      if(b.hp <= 0) return;
      var s = b.logo ? {f:'rgba(212,165,90,.3)', s:GOLD_L, t:'#1a1200'} : TIERS[Math.min(b.hp - 1, TIERS.length - 1)];
      ctx.save();
      ctx.shadowColor = s.s; ctx.shadowBlur = b.logo ? 16 : 9;
      ctx.fillStyle = s.f; ctx.strokeStyle = s.s; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = b.logo ? GOLD_L : s.t;
      ctx.font = '700 ' + Math.round(cell * 0.3) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.logo ? 'ST' : String(b.hp), b.x + b.w / 2, b.y + b.h / 2 + 1);
    });

    pickups.forEach(function(p){
      if(p.taken) return;
      ctx.save();
      ctx.shadowColor = GOLD_L; ctx.shadowBlur = 12;
      ctx.strokeStyle = GOLD_L; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(240,217,168,.15)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = GOLD_L; ctx.font = '700 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+1', p.x, p.y + .5);
    });

    particles.forEach(function(pt){
      ctx.save(); ctx.globalAlpha = Math.max(0, pt.alpha);
      ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.5, 0, 6.29); ctx.fill();
      ctx.restore();
    });

    if(state === 'aim'){
      ctx.save();
      ctx.setLineDash([3, 7]); ctx.strokeStyle = 'rgba(240,217,168,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(launchX, launchY);
      ctx.lineTo(launchX + Math.sin(aimAngle) * H * 1.5, launchY - Math.cos(aimAngle) * H * 1.5);
      ctx.stroke(); ctx.restore();
      drawBall(launchX, launchY, 7, superShots > 0);
      if(ballCount > 1){
        ctx.fillStyle = GOLD_L; ctx.font = '700 11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('x' + ballCount, launchX, launchY + 19);
      }
    }

    balls.forEach(function(b){ drawBall(b.x, b.y, b.r, b.sup); });
  }

  function drawBall(x, y, r, sup){
    ctx.save();
    ctx.shadowColor = sup ? GOLD_L : '#FFFFFF'; ctx.shadowBlur = sup ? 20 : 12;
    ctx.fillStyle = sup ? GOLD_L : '#FFFFFF';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
    ctx.restore();
  }

  function loop(){
    try{ if(state === 'shoot') step(); draw(); }catch(e){ console.error(e); }
    requestAnimationFrame(loop);
  }

  function gameOver(){
    state = 'over'; started = false;
    st.lives = 0; st.total += score; if(round > st.best) st.best = round;
    saveState();
    saveLeaderboardRecord(st.playerName || 'მოცეკვავე', score, round);
    updateFoot();

    clearOv(); ov.style.display = 'flex';
    ov.appendChild(el('div','big','GAME OVER — სიცოცხლე ამოიწურა'));
    var sr = el('div','statrow');
    sr.innerHTML = '<div>რაუნდი<b>' + round + '</b></div><div>ქულა<b>' + score + '</b></div><div>საუკეთესო<b>' + (st.best || round) + '</b></div>';
    ov.appendChild(sr);

    var lbBox = el('div','lb-panel');
    var lb = getLeaderboard();
    lb.slice(0, 5).forEach(function(item, idx){
      var row = el('div', 'lb-item ' + (item.name === st.playerName ? 'is-me' : ''));
      var rankSym = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx + 1);
      row.innerHTML = '<div class="lb-left"><span class="lb-rank">' + rankSym + '</span><span class="lb-name">' + item.name + '</span></div><span class="lb-score">' + item.score.toLocaleString() + ' ქულა</span>';
      lbBox.appendChild(row);
    });
    ov.appendChild(lbBox);

    ov.appendChild(el('div','hint','+1 სიცოცხლისთვის დაახურე ბოტს და გაიარე 5-კითხვიანი კვიზი'));
    var b = el('button','pri', tg ? 'კვიზის გახსნა (+1 ❤️)' : 'მენიუში დაბრუნება');
    b.onclick = function(){ if(tg) tg.close(); else showMenu(); };
    ov.appendChild(b);
    renderHearts(0);

    if(tg && tg.HapticFeedback) try{ tg.HapticFeedback.notificationOccurred('error'); }catch(e){}
  }

  function updateFoot(){
    foot.textContent = st.total > 0
      ? ('ჯამური ქულა: ' + st.total + ' · საუკეთესო რაუნდი: ' + st.best)
      : 'რაუნდი +10 · მე-5 რაუნდი +25 · აგური +2 · სიჩქარე იზრდება!';
  }

  function setAim(cx, cy){
    var r = cv.getBoundingClientRect();
    var dx = (cx - r.left) - launchX, dy = (cy - r.top) - launchY;
    if(dy > -10) dy = -10;
    aimAngle = Math.max(-1.35, Math.min(1.35, Math.atan2(dx, -dy)));
  }

  function down(e){ if(state !== 'aim') return; aiming = true; var t = e.touches ? e.touches[0] : e; setAim(t.clientX, t.clientY); e.preventDefault(); }
  function move(e){ if(!aiming) return; var t = e.touches ? e.touches[0] : e; setAim(t.clientX, t.clientY); e.preventDefault(); }
  function up(e){ if(!aiming) return; aiming = false; launch(); if(tg && tg.HapticFeedback) try{tg.HapticFeedback.impactOccurred('light');}catch(err){} e.preventDefault(); }

  cv.addEventListener('touchstart', down, {passive:false});
  cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', up, {passive:false});
  cv.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  window.addEventListener('resize', fit);

  lbBtn.addEventListener('click', showLeaderboardScreen);

  resetBtn.addEventListener('click', function(){
    st = {lives:3, livesTs:Date.now(), total:0, best:0, highScore:0, playerName: st.playerName, bonusSeen:''};
    saveState(); renderHearts(3); updateFoot(); showMenu();
    showBanner('პროგრესი განულდა', 1600);
  });

  loadState(function(){
    refreshLives(); grantBonus();
    renderHearts(); updateFoot(); showMenu();
    fit();
    setTimeout(fit, 120);
    loop();
  });
})();
</script>
</body>
